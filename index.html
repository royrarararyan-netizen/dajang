<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>다장</title><style>*{box-sizing:border-box}body{margin:0;background:#dfe8e1;font:15px system-ui;color:#eef6ef}#app{max-width:430px;min-height:100vh;margin:auto;background:#171c19;padding-bottom:82px}.top{display:flex;gap:10px;align-items:center;padding:16px;border-bottom:1px solid #334}.brand{font-size:24px;font-weight:900;color:#64df8c}.loc{flex:1;background:none;border:0;color:white;text-align:left;line-height:1.3}.notice{padding:13px 16px;background:#203125;line-height:1.6}.notice b{color:#79e89e}.filters{display:flex;gap:8px;overflow:auto;padding:14px}.filters button,.row{border:1px solid #3d4b40;background:#263028;color:white;padding:10px;border-radius:14px}.filters button{white-space:nowrap}.empty{text-align:center;padding:60px 20px;color:#b8c4ba;line-height:1.7}.card{display:flex;gap:12px;padding:15px;border-top:1px solid #303a32}.photo{width:86px;height:86px;border-radius:12px;background:#2b352d;display:grid;place-items:center;overflow:hidden;font-size:30px}.photo img{width:100%;height:100%;object-fit:cover}.name{font-weight:800}.meta{color:#aab5ad;font-size:13px;margin:7px 0}.price{font-weight:900}.fab{position:fixed;bottom:90px;right:max(16px,calc((100vw - 430px)/2 + 16px));border:0;border-radius:24px;padding:14px;background:#55ca7d;color:#062413;font-weight:900}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;display:flex;justify-content:space-around;padding:12px;background:#202722;border-top:1px solid #354}.nav button{border:0;background:none;color:#b8c4ba}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:end center}.sheet{background:#19201c;width:min(430px,100%);padding:20px;border-radius:20px 20px 0 0}.sheet input,.sheet textarea{width:100%;margin:7px 0 12px;padding:12px;border-radius:9px;border:1px solid #455;background:#252e27;color:white}.primary{width:100%;border:0;border-radius:10px;padding:13px;background:#55ca7d;color:#082413;font-weight:900}.hidden{display:none}</style><div id="app"></div><script>const $=s=>document.querySelector(s),items=JSON.parse(localStorage.dajangItems||'[]');let place='내 동네 찾기';function save(){localStorage.dajangItems=JSON.stringify(items)}function render(){app.innerHTML='<header class="top"><b class="brand">♻ 다장</b><button class="loc" id="loc">'+place+'</button></header><div class="notice"><b>다장 수익금의 일부는 환경재단에 기부됩니다.</b><br>버려질 뻔한 물건을 다시 쓰는 선택이 환경을 바꿉니다.</div><div class="filters"><button>전체</button><button>♻ 소형가전</button><button>♻ 가구</button><button>♻ 생활용품</button></div><main>'+ (items.length?items.map(x=>'<article class="card"><div class="photo">'+(x.p?'<img src="'+x.p+'">':'🗑️')+'</div><div><div class="name">'+x.n+'</div><div class="meta">'+place+' · 방금 전</div><div>'+x.d+'</div><div class="price">'+x.w+'원</div></div></article>').join(''):'<div class="empty">🗑️<h3>아직 내 근처에 물건이 없어요.</h3>첫 고장품을 등록해 보세요.<br><br><button class="row" id="guide">🛠 고장품 수리 가이드</button></div>')+'</main><button class="fab" id="add">＋ 고장품 등록</button><nav class="nav"><button>⌂ 홈</button><button id="near">⌖ 내 근처</button><button>◌ 채팅</button><button>♙ 나의 다장</button></nav>';$('#add').onclick=form;$('#loc').onclick=find;$('#near').onclick=()=>alert('📍 내 동네 · '+place+'\n현재 위치 기준 가까운 물건을 보여드려요.');$('#guide')&&($('#guide').onclick=()=>alert('수리 전에는 전원을 분리하고 고장 부위를 사진으로 남겨주세요.'))}function find(){navigator.geolocation?.getCurrentPosition(()=>{place='📍 현재 위치의 내 동네';render()},()=>alert('브라우저 위치 권한을 허용해주세요.'))||alert('이 브라우저는 위치 기능을 지원하지 않아요.')}function form(){let d=document.createElement('div');d.className='modal';d.innerHTML='<form class="sheet" id="f"><h2>고장품 등록</h2><input name="n" required placeholder="물건 이름"><input name="w" type="number" required placeholder="희망 가격"><input id="p" type="file" accept="image/*"><textarea name="d" required placeholder="고장 상태를 솔직히 적어주세요"></textarea><button class="primary">등록하기</button></form>';document.body.append(d);$('#f').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));let f=$('#p').files[0];if(f){let r=new FileReader;r.onload=()=>{x.p=r.result;items.unshift(x);save();d.remove();render()};r.readAsDataURL(f)}else{items.unshift(x);save();d.remove();render()}}}render()</script>
